
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#08110f">
<title>Próton Engine</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#08110f;color:#54efb1;
 font-family:Arial,sans-serif;overflow:hidden;
 touch-action:none
}
header{
 height:55px;background:#101c19;
 display:flex;align-items:center;justify-content:space-between;
 padding:0 15px;border-bottom:1px solid #245440
}
.logo{font-weight:bold;letter-spacing:2px}
button{
 background:#17372c;color:#70ffc1;border:1px solid #286849;
 border-radius:12px;padding:12px;font-weight:bold
}
main{height:calc(100dvh - 55px);display:flex;flex-direction:column}
#game{width:100%;flex:1;min-height:0;display:block;background:#101820}
.hud{
 display:flex;justify-content:space-between;
 padding:8px 14px;background:#101c19;font-size:12px
}
.controls{
 height:145px;background:#0d1714;
 display:flex;justify-content:space-around;align-items:center;
 padding:10px
}
#stick{
 width:112px;height:112px;border-radius:50%;
 background:#19352b;border:2px solid #347b58;
 position:relative;touch-action:none
}
#knob{
 width:43px;height:43px;border-radius:50%;
 background:#54efb1;position:absolute;
 left:32px;top:32px;pointer-events:none
}
.look{
 display:flex;gap:9px;align-items:center
}
.action{width:58px;height:58px;border-radius:50%;font-size:20px}
#status{color:#a0b7aa}
</style>
</head>

<body>
<header>
 <div class="logo">⚛ PROTON ENGINE</div>
 <button id="full">⛶</button>
</header>

<main>
 <canvas id="game"></canvas>

 <div class="hud">
  <span>HP: 100</span>
  <span>RAYCASTER 1.0</span>
  <span id="status">ONLINE</span>
 </div>

 <div class="controls">
  <div id="stick"><div id="knob"></div></div>
  <div class="look">
   <button class="action" id="left">↶</button>
   <button class="action" id="right">↷</button>
  </div>
 </div>
</main>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const map=[
"############",
"#..........#",
"#..##......#",
"#..........#",
"#......#...#",
"#......#...#",
"#..........#",
"#...##.....#",
"#..........#",
"############"
];

let px=2.5,py=2.5,angle=0;
const FOV=Math.PI/3;
let moveX=0,moveY=0;

function resize(){
 const rect=canvas.getBoundingClientRect();
 const dpr=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.floor(rect.width*dpr);
 canvas.height=Math.floor(rect.height*dpr);
}
window.addEventListener("resize",resize);
resize();

function wall(x,y){
 const mx=Math.floor(x),my=Math.floor(y);
 return !map[my] || map[my][mx]!=="." ;
}

function render(){
 const w=canvas.width,h=canvas.height;
 if(!w||!h)return;

 ctx.fillStyle="#182b3b";
 ctx.fillRect(0,0,w,h/2);
 ctx.fillStyle="#403b32";
 ctx.fillRect(0,h/2,w,h/2);

 for(let x=0;x<w;x++){
  const ray=angle-FOV/2+(x/w)*FOV;
  const dx=Math.cos(ray),dy=Math.sin(ray);
  let dist=0.02,hitX=0,hitY=0;

  while(dist<16){
   hitX=px+dx*dist;
   hitY=py+dy*dist;
   if(wall(hitX,hitY))break;
   dist+=0.025;
  }

  const corrected=Math.max(0.1,dist*Math.cos(ray-angle));
  const wallHeight=Math.min(h*3,h/corrected);
  const top=h/2-wallHeight/2;

  const brightness=Math.max(.15,1-corrected/10);
  const texture=Math.floor((hitX*9+hitY*9)%2);
  const green=texture?190:125;

  ctx.fillStyle=`rgb(${Math.floor(35*brightness)},${Math.floor(green*brightness)},${Math.floor(105*brightness)})`;
  ctx.fillRect(x,top,1,wallHeight);
 }
}

function update(){
 const speed=.045;
 const nx=px+Math.cos(angle)*moveY*speed+
 Math.cos(angle+Math.PI/2)*moveX*speed;
 const ny=py+Math.sin(angle)*moveY*speed+
 Math.sin(angle+Math.PI/2)*moveX*speed;

 if(!wall(nx,py))px=nx;
 if(!wall(px,ny))py=ny;

 render();
 requestAnimationFrame(update);
}
requestAnimationFrame(update);

// JOYSTICK
const stick=document.getElementById("stick");
const knob=document.getElementById("knob");
let active=false;

function joystick(e){
 const r=stick.getBoundingClientRect();
 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);
 const max=34;
 const len=Math.hypot(dx,dy);
 if(len>max){dx=dx/len*max;dy=dy/len*max}
 knob.style.transform=`translate(${dx}px,${dy}px)`;
 moveX=dx/max;
 moveY=-dy/max;
}
stick.addEventListener("pointerdown",e=>{
 active=true;stick.setPointerCapture(e.pointerId);joystick(e);
});
stick.addEventListener("pointermove",e=>{
 if(active)joystick(e);
});
function release(){
 active=false;moveX=0;moveY=0;
 knob.style.transform="translate(0,0)";
}
stick.addEventListener("pointerup",release);
stick.addEventListener("pointercancel",release);

// ROTATION
document.getElementById("left").onpointerdown=()=>angle-=.18;
document.getElementById("right").onpointerdown=()=>angle+=.18;

// FULLSCREEN
document.getElementById("full").onclick=()=>{
 if(!document.fullscreenElement){
  document.documentElement.requestFullscreen?.();
 }else{
  document.exitFullscreen?.();
 }
};
</script>
</body>
</html>
