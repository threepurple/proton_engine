
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#080611">
<title>BOMB CAVE</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  overflow: hidden;
  background: #080611;
  color: white;
  font-family: Arial, sans-serif;
  touch-action: none;
}

canvas { display: block; }

#menu {
  position: fixed;
  inset: 0;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle, #382052, #080611 75%);
}

h1 {
  color: #d2a0ff;
  font-size: 42px;
  letter-spacing: 5px;
  text-shadow: 0 0 20px #a044ff;
  text-align: center;
}

#menu p {
  color: #c7b5dc;
  letter-spacing: 3px;
}

button {
  color: white;
  background: #28163e;
  border: 1px solid #b56aff;
  border-radius: 12px;
  font-size: 18px;
  touch-action: none;
  user-select: none;
}

#play {
  padding: 15px 25px;
  margin-top: 20px;
}

#hud {
  display: none;
  position: fixed;
  inset: 0;
  pointer-events: none;
}

#info {
  position: absolute;
  top: 15px;
  left: 15px;
  font-size: 13px;
  text-shadow: 0 2px 4px black;
}

#cross {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 25px;
  text-shadow: 0 0 5px black;
}

#move {
  position: absolute;
  bottom: 20px;
  left: 15px;
  display: grid;
  grid-template-columns: 60px 60px 60px;
  gap: 5px;
  pointer-events: auto;
}

#move button,
#look button {
  width: 60px;
  height: 60px;
  padding: 0;
  border-radius: 50%;
  background: #25183dcc;
  font-size: 22px;
}

#look {
  position: absolute;
  right: 15px;
  bottom: 25px;
  display: flex;
  gap: 8px;
  pointer-events: auto;
}

button.active {
  background: #7841a8 !important;
  border-color: #e0baff;
}

#loadingError {
  display: none;
  position: fixed;
  z-index: 10;
  top: 10px;
  left: 10px;
  right: 10px;
  padding: 12px;
  background: #681e32;
  border-radius: 8px;
  font-size: 13px;
}
</style>
</head>

<body>

<div id="menu">
  <h1>BOMB CAVE</h1>
  <p>THE CORE MUST FALL</p>
  <button id="play">JOGAR DEMO</button>
</div>

<div id="hud">
  <div id="info">BOMB CAVE | DEMO 3D | MONOLASER</div>
  <div id="cross">+</div>

  <div id="move">
    <span></span>
    <button data-move="forward">▲</button>
    <span></span>
    <button data-move="left">◀</button>
    <button data-move="backward">▼</button>
    <button data-move="right">▶</button>
  </div>

  <div id="look">
    <button id="turnLeft">↶</button>
    <button id="turnRight">↷</button>
  </div>
</div>

<div id="loadingError"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";

// =================================
// CONFIGURAÇÃO DA CENA
// =================================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080611);
scene.fog = new THREE.Fog(0x080611, 12, 55);

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);

camera.position.set(0, 1.7, 5);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

document.body.appendChild(renderer.domElement);

// =================================
// TEXTURAS PROCEDURAIS
// =================================

function makeTexture(base, variation, lines = false) {
  const canvas = document.createElement("canvas");
  canvas.width = 256;
  canvas.height = 256;

  const ctx = canvas.getContext("2d");
  ctx.fillStyle = base;
  ctx.fillRect(0, 0, 256, 256);

  for (let i = 0; i < 1800; i++) {
    const x = Math.random() * 256;
    const y = Math.random() * 256;
    const alpha = Math.random() * 0.13;

    ctx.fillStyle = `rgba(255,255,255,${alpha})`;

    if (lines) {
      ctx.fillRect(x, y, 35 + Math.random() * 50, 1);
    } else {
      ctx.fillRect(x, y, 2, 2);
    }
  }

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  return texture;
}

const steelTexture = makeTexture("#777d83", 20, true);
const plasticTexture = makeTexture("#17191d", 20, false);

// =================================
// MATERIAIS
// =================================

const steel = new THREE.MeshStandardMaterial({
  color: 0xb0b5bb,
  map: steelTexture,
  metalness: 0.9,
  roughness: 0.3
});

const darkSteel = new THREE.MeshStandardMaterial({
  color: 0x414750,
  map: steelTexture,
  metalness: 0.85,
  roughness: 0.4
});

const blackPlastic = new THREE.MeshStandardMaterial({
  color: 0x24262a,
  map: plasticTexture,
  roughness: 0.88,
  metalness: 0.05
});

const purpleGlow = new THREE.MeshStandardMaterial({
  color: 0x8b36ff,
  emissive: 0x6414ff,
  emissiveIntensity: 2.2,
  metalness: 0.3,
  roughness: 0.25
});

// =================================
// ILUMINAÇÃO
// =================================

scene.add(new THREE.HemisphereLight(
  0xb9aaff,
  0x201323,
  1.5
));

const coreLight = new THREE.PointLight(
  0xa33cff,
  45,
  45
);

coreLight.position.set(0, 4, -12);
scene.add(coreLight);

// =================================
// CHÃO
// =================================

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({
    color: 0x302a38,
    roughness: 1
  })
);

floor.rotation.x = -Math.PI / 2;
scene.add(floor);

// =================================
// TETO
// =================================

const ceiling = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({
    color: 0x100d19
  })
);

ceiling.rotation.x = Math.PI / 2;
ceiling.position.y = 7;
scene.add(ceiling);

// =================================
// PAREDES
// =================================

const wallMaterial = new THREE.MeshStandardMaterial({
  color: 0x292333,
  roughness: 1
});

function makeWall(x, y, z, sx, sy, sz) {
  const wall = new THREE.Mesh(
    new THREE.BoxGeometry(sx, sy, sz),
    wallMaterial
  );

  wall.position.set(x, y, z);
  scene.add(wall);
}

makeWall(0, 3.5, -30, 60, 7, 1);
makeWall(0, 3.5, 30, 60, 7, 1);
makeWall(-30, 3.5, 0, 1, 7, 60);
makeWall(30, 3.5, 0, 1, 7, 60);

// =================================
// ROCHAS
// =================================

const rockMaterial = new THREE.MeshStandardMaterial({
  color: 0x51465d,
  roughness: 1
});

for (let i = 0; i < 65; i++) {
  const rock = new THREE.Mesh(
    new THREE.DodecahedronGeometry(
      0.4 + Math.random(),
      0
    ),
    rockMaterial
  );

  rock.position.set(
    (Math.random() - 0.5) * 45,
    0.3,
    (Math.random() - 0.5) * 45
  );

  rock.rotation.set(
    Math.random() * 3,
    Math.random() * 3,
    Math.random() * 3
  );

  scene.add(rock);
}

// =================================
// CRISTAIS
// =================================

const crystalMaterial = new THREE.MeshStandardMaterial({
  color: 0x9c43ff,
  emissive: 0x7b18ff,
  emissiveIntensity: 2
});

for (let i = 0; i < 14; i++) {
  const crystal = new THREE.Mesh(
    new THREE.OctahedronGeometry(
      0.5 + Math.random() * 0.5
    ),
    crystalMaterial
  );

  crystal.position.set(
    (Math.random() - 0.5) * 36,
    1 + Math.random() * 2,
    (Math.random() - 0.5) * 36
  );

  scene.add(crystal);
}

// =================================
// NÚCLEO PRINCIPAL
// =================================

const core = new THREE.Mesh(
  new THREE.SphereGeometry(2.2, 48, 48),
  new THREE.MeshStandardMaterial({
    color: 0x9b35ff,
    emissive: 0x7a13ff,
    emissiveIntensity: 3,
    roughness: 0.25,
    metalness: 0.2
  })
);

core.position.set(0, 3, -12);
scene.add(core);

const ring = new THREE.Mesh(
  new THREE.TorusGeometry(3, 0.07, 12, 80),
  new THREE.MeshBasicMaterial({ color: 0xd6a0ff })
);

ring.position.copy(core.position);
ring.rotation.x = Math.PI / 2.5;
scene.add(ring);

const ring2 = new THREE.Mesh(
  new THREE.TorusGeometry(2.7, 0.035, 10, 80),
  new THREE.MeshBasicMaterial({ color: 0x8d35ff })
);

ring2.position.copy(core.position);
ring2.rotation.y = Math.PI / 2;
scene.add(ring2);

// =================================
// MONOLASER 3D
// =================================

const monolaser = new THREE.Group();

// Função para construir peças da arma

function gunPart(
  geometry,
  material,
  x,
  y,
  z,
  parent = monolaser
) {
  const mesh = new THREE.Mesh(geometry, material);

  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;

  parent.add(mesh);
  return mesh;
}

// Corpo principal retangular

gunPart(
  new THREE.BoxGeometry(0.42, 0.25, 0.48),
  steel,
  0, 0, -0.12
);

// Parte superior do corpo

gunPart(
  new THREE.BoxGeometry(0.34, 0.035, 0.38),
  darkSteel,
  0, 0.145, -0.12
);

// Placa lateral esquerda e direita

for (const side of [-1, 1]) {
  gunPart(
    new THREE.BoxGeometry(0.025, 0.13, 0.30),
    darkSteel,
    side * 0.215, 0, -0.12
  );
}

// Cano principal

const barrel = gunPart(
  new THREE.CylinderGeometry(0.085, 0.085, 0.42, 32),
  steel,
  0, 0.015, -0.53
);

barrel.rotation.x = Math.PI / 2;

// Anéis metálicos do cano

for (let i = 0; i < 5; i++) {
  const band = gunPart(
    new THREE.CylinderGeometry(0.092, 0.092, 0.018, 32),
    darkSteel,
    0, 0.015, -0.37 - i * 0.075
  );

  band.rotation.x = Math.PI / 2;
}

// Bocal frontal

const muzzle = gunPart(
  new THREE.CylinderGeometry(0.115, 0.115, 0.055, 32),
  darkSteel,
  0, 0.015, -0.755
);

muzzle.rotation.x = Math.PI / 2;

// Abertura luminosa

const muzzleGlowMesh = gunPart(
  new THREE.CylinderGeometry(0.073, 0.073, 0.058, 32),
  purpleGlow,
  0, 0.015, -0.76
);

muzzleGlowMesh.rotation.x = Math.PI / 2;

// Centro escuro do bocal

const muzzleCenter = gunPart(
  new THREE.CylinderGeometry(0.043, 0.043, 0.06, 24),
  blackPlastic,
  0, 0.015, -0.765
);

muzzleCenter.rotation.x = Math.PI / 2;

// Pino superior

gunPart(
  new THREE.BoxGeometry(0.075, 0.09, 0.075),
  steel,
  0.12, 0.19, -0.12
);

// Empunhadura angular de plástico

const gripShape = new THREE.Shape();

gripShape.moveTo(-0.16, 0.10);
gripShape.lineTo(0.16, 0.10);
gripShape.lineTo(0.22, -0.12);
gripShape.lineTo(0.10, -0.38);
gripShape.lineTo(-0.10, -0.43);
gripShape.lineTo(-0.28, -0.20);
gripShape.closePath();

const gripGeometry = new THREE.ExtrudeGeometry(gripShape, {
  depth: 0.20,
  bevelEnabled: true,
  bevelSegments: 3,
  bevelSize: 0.025,
  bevelThickness: 0.025
});

gunPart(
  gripGeometry,
  blackPlastic,
  0, -0.17, -0.12
);

// Ranhuras no cabo

for (let i = 0; i < 4; i++) {
  gunPart(
    new THREE.BoxGeometry(0.205, 0.018, 0.025),
    darkSteel,
    0, -0.32 - i * 0.045, -0.015
  );
}

// Aro do gatilho

gunPart(
  new THREE.TorusGeometry(0.105, 0.018, 10, 28),
  steel,
  0, -0.19, -0.30
);

// Gatilho

gunPart(
  new THREE.BoxGeometry(0.035, 0.12, 0.035),
  darkSteel,
  0, -0.19, -0.30
);

// Pequeno detalhe lateral

gunPart(
  new THREE.BoxGeometry(0.025, 0.06, 0.12),
  steel,
  0.23, 0.015, -0.12
);

// Posição da arma na câmera

monolaser.position.set(0.36, -0.34, -0.72);
monolaser.rotation.set(0, 0, 0);
monolaser.scale.setScalar(0.8);

// A arma acompanha a câmera

camera.add(monolaser);

// =================================
// CONTROLES
// =================================

const keys = {
  forward: false,
  backward: false,
  left: false,
  right: false,
  turnLeft: false,
  turnRight: false
};

function bindButton(button, key) {
  button.addEventListener("pointerdown", event => {
    event.preventDefault();
    button.setPointerCapture(event.pointerId);
    keys[key] = true;
    button.classList.add("active");
  });

  function release(event) {
    if (event) event.preventDefault();

    keys[key] = false;
    button.classList.remove("active");
  }

  button.addEventListener("pointerup", release);
  button.addEventListener("pointercancel", release);
  button.addEventListener("lostpointercapture", release);
}

document.querySelectorAll("[data-move]").forEach(button => {
  bindButton(button, button.dataset.move);
});

bindButton(
  document.getElementById("turnLeft"),
  "turnLeft"
);

bindButton(
  document.getElementById("turnRight"),
  "turnRight"
);

// =================================
// MOVIMENTAÇÃO
// =================================

let angle = 0;

const direction = new THREE.Vector3();

const MOVE_SPEED = 5;
const TURN_SPEED = 2.2;

function updateMovement(deltaTime) {
  if (keys.turnLeft) {
    angle += TURN_SPEED * deltaTime;
  }

  if (keys.turnRight) {
    angle -= TURN_SPEED * deltaTime;
  }

  camera.rotation.set(0, angle, 0);

  const moveY =
    (keys.forward ? 1 : 0) -
    (keys.backward ? 1 : 0);

  const moveX =
    (keys.right ? 1 : 0) -
    (keys.left ? 1 : 0);

  direction.set(
    -Math.sin(angle) * moveY +
     Math.cos(angle) * moveX,
    0,
    -Math.cos(angle) * moveY -
     Math.sin(angle) * moveX
  );

  if (direction.lengthSq() > 0) {
    direction.normalize();

    camera.position.addScaledVector(
      direction,
      MOVE_SPEED * deltaTime
    );
  }

  camera.position.x = THREE.MathUtils.clamp(
    camera.position.x,
    -28,
    28
  );

  camera.position.z = THREE.MathUtils.clamp(
    camera.position.z,
    -28,
    28
  );

  camera.position.y = 1.7;
}

// =================================
// ANIMAÇÃO
// =================================

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const deltaTime = Math.min(clock.getDelta(), 0.05);
  const time = clock.elapsedTime;

  // Pulsação do núcleo

  const pulse = 1 + Math.sin(time * 2) * 0.035;
  core.scale.setScalar(pulse);

  core.rotation.y = time * 0.3;

  ring.rotation.z = time * 0.5;
  ring2.rotation.x = time * 0.4;

  coreLight.intensity = 40 + Math.sin(time * 3) * 8;

  // Movimento da câmera

  updateMovement(deltaTime);

  // Pequena oscilação da arma

  const moving =
    keys.forward ||
    keys.backward ||
    keys.left ||
    keys.right;

  const bob = moving ? Math.sin(time * 9) * 0.008 : 0;

  monolaser.position.y = -0.34 + bob;

  // Renderização

  renderer.render(scene, camera);
}

animate();

// =================================
// INICIAR JOGO
// =================================

document.getElementById("play").addEventListener("click", () => {
  document.getElementById("menu").style.display = "none";
  document.getElementById("hud").style.display = "block";
});

// =================================
// REDIMENSIONAR TELA
// =================================

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
});

// =================================
// SERVICE WORKER
// =================================

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js")
    .catch(error => {
      console.warn("Service Worker:", error);
    });
}

// =================================
// ERROS
// =================================

window.addEventListener("error", event => {
  const box = document.getElementById("loadingError");

  box.style.display = "block";
  box.textContent = "Erro ao carregar: " + event.message;
});

</script>
</body>
</html>
