<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BOMB CAVE</title>
<style>
* { box-sizing:border-box }
body { margin:0; overflow:hidden; background:#080611; color:white; font-family:Arial; touch-action:none }
canvas { display:block }
#menu { position:fixed; inset:0; z-index:5; display:flex; flex-direction:column; align-items:center; justify-content:center; background:radial-gradient(circle,#382052,#080611 75%) }
h1 { color:#d2a0ff; font-size:42px; letter-spacing:5px; text-shadow:0 0 20px #a044ff }
button { color:white; background:#28163e; border:1px solid #b56aff; border-radius:12px; padding:14px 20px; font-size:18px; touch-action:none }
#hud { display:none; position:fixed; inset:0; pointer-events:none }
#info { position:absolute; top:15px; left:15px; text-shadow:0 2px 4px black }
#cross { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:25px }
#move { position:absolute; bottom:20px; left:15px; display:grid; grid-template-columns:60px 60px 60px; gap:5px; pointer-events:auto }
#move button { width:60px; height:60px; padding:0; border-radius:50% }
#look { position:absolute; right:15px; bottom:25px; display:flex; gap:8px; pointer-events:auto }
#look button { width:60px; height:60px; padding:0; border-radius:50% }
</style>
</head>
<body>

<div id="menu">
  <h1>BOMB CAVE</h1>
  <p>THE CORE MUST FALL</p>
  <button id="play">JOGAR DEMO</button>
</div>

<div id="hud">
  <div id="info">BOMB CAVE | DEMO 3D</div>
  <div id="cross">+</div>
  <div id="move">
    <span></span><button data-move="forward">▲</button><span></span>
    <button data-move="left">◀</button>
    <button data-move="backward">▼</button>
    <button data-move="right">▶</button>
  </div>
  <div id="look">
    <button id="turnLeft">↶</button>
    <button id="turnRight">↷</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080611);
scene.fog = new THREE.Fog(0x080611, 12, 55);

const camera = new THREE.PerspectiveCamera(
  75, innerWidth / innerHeight, 0.1, 100
);
camera.position.set(0, 1.7, 5);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// ILUMINAÇÃO
scene.add(new THREE.HemisphereLight(0xb9aaff, 0x201323, 1.5));

const light = new THREE.PointLight(0xa33cff, 45, 45);
light.position.set(0, 4, -12);
scene.add(light);

// CHÃO
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({ color:0x302a38, roughness:1 })
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

// TETO
const ceiling = new THREE.Mesh(
  new THREE.PlaneGeometry(60, 60),
  new THREE.MeshStandardMaterial({ color:0x100d19 })
);
ceiling.rotation.x = Math.PI / 2;
ceiling.position.y = 7;
scene.add(ceiling);

// PAREDES
const wallMat = new THREE.MeshStandardMaterial({ color:0x292333 });

function makeWall(x,y,z,sx,sy,sz) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz), wallMat);
  m.position.set(x,y,z);
  scene.add(m);
}
makeWall(0,3.5,-30,60,7,1);
makeWall(0,3.5,30,60,7,1);
makeWall(-30,3.5,0,1,7,60);
makeWall(30,3.5,0,1,7,60);

// ROCHAS
const rockMat = new THREE.MeshStandardMaterial({ color:0x51465d });
for(let i=0;i<65;i++){
  const rock = new THREE.Mesh(
    new THREE.DodecahedronGeometry(0.4+Math.random(),0),
    rockMat
  );
  rock.position.set(
    (Math.random()-0.5)*45,
    0.3,
    (Math.random()-0.5)*45
  );
  rock.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);
  scene.add(rock);
}

// CRISTAIS
const crystalMat = new THREE.MeshStandardMaterial({
  color:0x9c43ff,
  emissive:0x7b18ff,
  emissiveIntensity:2
});
for(let i=0;i<14;i++){
  const crystal = new THREE.Mesh(
    new THREE.OctahedronGeometry(0.5+Math.random()*0.5),
    crystalMat
  );
  crystal.position.set(
    (Math.random()-0.5)*36,
    1+Math.random()*2,
    (Math.random()-0.5)*36
  );
  scene.add(crystal);
}

// NÚCLEO
const core = new THREE.Mesh(
  new THREE.SphereGeometry(2.2,32,32),
  new THREE.MeshStandardMaterial({
    color:0x9b35ff,
    emissive:0x7a13ff,
    emissiveIntensity:3,
    roughness:0.25,
    metalness:0.2
  })
);
core.position.set(0,3,-12);
scene.add(core);

const ring = new THREE.Mesh(
  new THREE.TorusGeometry(3,0.07,12,80),
  new THREE.MeshBasicMaterial({ color:0xd6a0ff })
);
ring.position.copy(core.position);
ring.rotation.x = Math.PI/2.5;
scene.add(ring);

// CONTROLES
const keys = {
  forward:false,
  backward:false,
  left:false,
  right:false,
  turnLeft:false,
  turnRight:false
};

document.querySelectorAll("[data-move]").forEach(btn=>{
  const key = btn.dataset.move;
  btn.addEventListener("pointerdown",e=>{
    e.preventDefault();
    keys[key]=true;
  });
  const release=()=>{
    keys[key]=false;
  };
  btn.addEventListener("pointerup",release);
  btn.addEventListener("pointercancel",release);
  btn.addEventListener("pointerleave",release);
});

function bindTurn(id,key){
  const btn=document.getElementById(id);
  btn.addEventListener("pointerdown",e=>{
    e.preventDefault();
    keys[key]=true;
  });
  const release=()=>keys[key]=false;
  btn.addEventListener("pointerup",release);
  btn.addEventListener("pointercancel",release);
  btn.addEventListener("pointerleave",release);
}
bindTurn("turnLeft","turnLeft");
bindTurn("turnRight","turnRight");

// ROTAÇÃO E MOVIMENTO CORRIGIDOS
let angle=0;
const direction = new THREE.Vector3();

function updateMovement(){
  if(keys.turnLeft) angle += 0.035;
  if(keys.turnRight) angle -= 0.035;

  camera.rotation.y=angle;

  const moveY =
    (keys.forward ? 1 : 0) -
    (keys.backward ? 1 : 0);

  const moveX =
    (keys.right ? 1 : 0) -
    (keys.left ? 1 : 0);

  direction.set(
    -Math.sin(angle)*moveY + Math.cos(angle)*moveX,
    0,
    -Math.cos(angle)*moveY - Math.sin(angle)*moveX
  );

  if(direction.lengthSq()>0){
    direction.normalize();
    camera.position.addScaledVector(direction,0.09);
  }

  // Limites da caverna
  camera.position.x=THREE.MathUtils.clamp(camera.position.x,-28,28);
  camera.position.z=THREE.MathUtils.clamp(camera.position.z,-28,28);
  camera.position.y=1.7;
}

// ANIMAÇÃO
const clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);

  const t=clock.getElapsedTime();
  core.scale.setScalar(1+Math.sin(t*2)*0.035);
  core.rotation.y=t*0.3;
  ring.rotation.z=t*0.5;
  light.intensity=40+Math.sin(t*3)*8;

  updateMovement();
  renderer.render(scene,camera);
}
animate();

// INICIAR
document.getElementById("play").addEventListener("click",()=>{
  document.getElementById("menu").style.display="none";
  document.getElementById("hud").style.display="block";
});

// REDIMENSIONAR
window.addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

// SERVICE WORKER
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js").catch(console.error);
}
</script>
</body>
</html>
