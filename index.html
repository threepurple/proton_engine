
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#08110f">
<title>BOMB CAVE</title>
<link rel="manifest" href="./manifest.json">

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080d12;color:white;
 font-family:Arial,sans-serif;overflow:hidden;
 touch-action:none
}
header{
 height:48px;background:#101c19;
 display:flex;align-items:center;
 justify-content:space-between;padding:0 12px
}
button{
 background:#174a38;color:white;
 border:1px solid #50d99b;
 border-radius:8px;padding:12px;font-weight:bold
}
main{height:calc(100dvh - 48px);position:relative}
#game{width:100%;height:100%;display:block}
#menu{
 position:absolute;inset:0;z-index:5;
 display:flex;align-items:center;
 justify-content:center;flex-direction:column;
 background:linear-gradient(#06110caa,#06110cee);
 gap:20px;text-align:center
}
.title{
 font-size:clamp(42px,12vw,72px);
 font-weight:1000;letter-spacing:5px;
 color:#d9ffe9;text-shadow:0 0 20px #27db83
}
#play{font-size:18px;padding:17px 35px}
#controls{
 display:none;position:absolute;bottom:15px;
 left:0;right:0;justify-content:space-between;
 align-items:end;padding:12px;
 pointer-events:none
}
#stick{
 width:110px;height:110px;border-radius:50%;
 background:#153a30aa;border:2px solid #57e8a4;
 position:relative;pointer-events:auto;
 touch-action:none
}
#knob{
 width:42px;height:42px;border-radius:50%;
 background:#65f4b0;position:absolute;
 left:32px;top:32px;pointer-events:none
}
.look{display:flex;gap:10px;pointer-events:auto}
.look button{width:58px;height:58px;font-size:22px}
#hint{
 position:absolute;top:12px;left:0;right:0;
 text-align:center;color:#a5f5ce;
 font-size:12px;pointer-events:none
}
</style>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
 }
}
</script>
</head>

<body>
<header>
 <b>⚛ THREE PURPLE | BOMB CAVE</b>
 <button id="full">⛶</button>
</header>

<main>
 <canvas id="game"></canvas>

 <div id="menu">
  <div style="letter-spacing:4px;color:#6bdca0">
   THREE PURPLE APRESENTA
  </div>
  <div class="title">BOMB CAVE</div>
  <div>ALIEN PLANET EXPEDITION</div>
  <button id="play">▶ JOGAR DEMO</button>
  <small>3D PROTOTYPE 0.2</small>
 </div>

 <div id="hint">CAVERNA ALIENÍGENA • SETOR 01</div>

 <div id="controls">
  <div id="stick"><div id="knob"></div></div>
  <div class="look">
   <button id="left">↶</button>
   <button id="right">↷</button>
  </div>
 </div>
</main>

<script type="module">
import * as THREE from "three";

const canvas=document.querySelector("#game");

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x101c28);
scene.fog=new THREE.Fog(0x101c28,7,27);

const camera=new THREE.PerspectiveCamera(
 75,1,0.1,100
);
camera.position.set(0,1.6,5);

const renderer=new THREE.WebGLRenderer({
 canvas,antialias:false
});
renderer.setPixelRatio(
 Math.min(window.devicePixelRatio,1.5)
);
renderer.shadowMap.enabled=true;
renderer.outputColorSpace=THREE.SRGBColorSpace;

scene.add(new THREE.HemisphereLight(
 0x8bbdce,0x17100d,1.5
));

const light=new THREE.PointLight(0x39eaff,35,14);
light.position.set(0,2,0);
scene.add(light);

const greenLight=new THREE.PointLight(
 0x28ff9b,18,10
);
greenLight.position.set(-3,2,-5);
scene.add(greenLight);

const stone=new THREE.MeshStandardMaterial({
 color:0x353d42,roughness:1,
 flatShading:true
});

const floorMat=new THREE.MeshStandardMaterial({
 color:0x252d32,roughness:1
});

const crystalMat=new THREE.MeshStandardMaterial({
 color:0x28e9d4,
 emissive:0x087e78,
 emissiveIntensity:2,
 roughness:0.3
});

// CHÃO
const floor=new THREE.Mesh(
 new THREE.PlaneGeometry(30,30),floorMat
);
floor.rotation.x=-Math.PI/2;
floor.position.y=0;
scene.add(floor);

// TETO
const ceiling=new THREE.Mesh(
 new THREE.PlaneGeometry(30,30),stone
);
ceiling.rotation.x=Math.PI/2;
ceiling.position.y=5;
scene.add(ceiling);

// PAREDES
function wall(x,y,z,w,h,d){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),stone
 );
 mesh.position.set(x,y,z);
 scene.add(mesh);
}

wall(0,2.5,-10,20,5,1);
wall(-10,2.5,0,1,5,20);
wall(10,2.5,0,1,5,20);
wall(0,2.5,10,20,5,1);

// ROCHAS
for(let i=0;i<65;i++){
 const rock=new THREE.Mesh(
  new THREE.IcosahedronGeometry(
   0.3+Math.random()*0.8,0
  ),stone
 );
 rock.position.set(
  (Math.random()-.5)*18,
  0.15+Math.random()*3.7,
  (Math.random()-.5)*18
 );
 rock.rotation.set(
  Math.random()*3,
  Math.random()*3,
  Math.random()*3
 );
 scene.add(rock);
}

// CRISTAIS
const crystals=[];
for(let i=0;i<12;i++){
 const crystal=new THREE.Mesh(
  new THREE.OctahedronGeometry(
   0.35+Math.random()*0.4
  ),crystalMat
 );
 crystal.position.set(
  (Math.random()-.5)*15,
  0.5+Math.random()*2,
  -2-Math.random()*13
 );
 scene.add(crystal);
 crystals.push(crystal);
}

// MOVIMENTAÇÃO
let moveX=0,moveY=0;
let angle=0;
let started=false;

const direction=new THREE.Vector3();

function update(){
 if(started){
  direction.set(
   Math.sin(angle)*moveY+
   Math.cos(angle)*moveX,
   0,
   -Math.cos(angle)*moveY+
   Math.sin(angle)*moveX
  );

  camera.position.addScaledVector(direction,0.075);

  camera.position.x=THREE.MathUtils.clamp(
   camera.position.x,-8.5,8.5
  );
  camera.position.z=THREE.MathUtils.clamp(
   camera.position.z,-8.5,8.5
  );

  camera.rotation.y=angle;
 }

 crystals.forEach((c,i)=>{
  c.rotation.y+=0.01;
  c.position.y+=Math.sin(Date.now()*.001+i)*0.0008;
 });
}

function resize(){
 const w=canvas.clientWidth;
 const h=canvas.clientHeight;
 if(!w||!h)return;

 camera.aspect=w/h;
 camera.updateProjectionMatrix();
 renderer.setSize(w,h,false);
}
window.addEventListener("resize",resize);
resize();

function animate(){
 requestAnimationFrame(animate);
 update();
 renderer.render(scene,camera);
}
animate();

// MENU
document.querySelector("#play").onclick=()=>{
 started=true;
 document.querySelector("#menu").style.display="none";
 document.querySelector("#controls").style.display="flex";
};

// JOYSTICK
const stick=document.querySelector("#stick");
const knob=document.querySelector("#knob");
let active=false;

stick.addEventListener("pointerdown",e=>{
 active=true;
 stick.setPointerCapture(e.pointerId);
});
stick.addEventListener("pointermove",e=>{
 if(!active)return;

 const r=stick.getBoundingClientRect();
 let dx=e.clientX-r.left-r.width/2;
 let dy=e.clientY-r.top-r.height/2;
 const len=Math.hypot(dx,dy);
 const max=34;

 if(len>max){
  dx=dx/len*max;
  dy=dy/len*max;
 }

 knob.style.transform=`translate(${dx}px,${dy}px)`;
 moveX=dx/max;
 moveY=-dy/max;
});

function release(){
 active=false;
 moveX=0;
 moveY=0;
 knob.style.transform="translate(0,0)";
}
stick.addEventListener("pointerup",release);
stick.addEventListener("pointercancel",release);

// ROTAÇÃO
document.querySelector("#left").onpointerdown=()=>{
 angle+=0.12;
};
document.querySelector("#right").onpointerdown=()=>{
 angle-=0.12;
};

// TELA CHEIA
document.querySelector("#full").onclick=async()=>{
 try{
  if(!document.fullscreenElement)
   await document.documentElement.requestFullscreen();
  else
   await document.exitFullscreen();
 }catch(e){}
};

</script>

<script>
if("serviceWorker" in navigator){
 window.addEventListener("load",()=>{
  navigator.serviceWorker.register("./sw.js");
 });
}
</script>
</body>
</html>
