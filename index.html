
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#08110f">
<title>Bomb Cave</title>
<link rel="manifest" href="./manifest.json">

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#08110f;
 color:#65efad;
 font-family:Arial,sans-serif;
 overflow:hidden;
 touch-action:none;
}

header{
 height:55px;
 background:#101c19;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 15px;
 border-bottom:1px solid #245440;
}

.logo{font-weight:bold;letter-spacing:2px}

button{
 background:#17372c;
 color:#70ffc1;
 border:1px solid #286849;
 border-radius:12px;
 padding:12px;
 font-weight:bold;
}

main{
 height:calc(100dvh - 55px);
 display:flex;
 flex-direction:column;
 position:relative;
}

#game{
 width:100%;
 flex:1;
 min-height:0;
 display:block;
 background:#101820;
}

.hud{
 display:none;
 justify-content:space-between;
 padding:8px 14px;
 background:#101c19;
 font-size:12px;
}

.controls{
 display:none;
 height:145px;
 background:#0d1714;
 justify-content:space-around;
 align-items:center;
 padding:10px;
}

#stick{
 width:112px;
 height:112px;
 border-radius:50%;
 background:#19352b;
 border:2px solid #347b58;
 position:relative;
 touch-action:none;
}

#knob{
 width:43px;
 height:43px;
 border-radius:50%;
 background:#54efb1;
 position:absolute;
 left:32px;
 top:32px;
 pointer-events:none;
}

.look{display:flex;gap:9px}
.action{
 width:58px;
 height:58px;
 border-radius:50%;
 font-size:20px;
}

/* MENU */

#menu{
 position:absolute;
 inset:0;
 z-index:5;
 background:
 linear-gradient(180deg,rgba(4,12,10,.72),rgba(3,10,8,.96)),
 repeating-linear-gradient(
  0deg,
  transparent 0px,
  transparent 3px,
  rgba(100,255,170,.035) 4px
 );
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 padding:25px;
 text-align:center;
}

.studio{
 color:#68ad8a;
 font-size:11px;
 letter-spacing:4px;
 margin-bottom:15px;
}

.title{
 color:#e9fff1;
 font-size:clamp(42px,12vw,72px);
 font-weight:1000;
 letter-spacing:5px;
 text-shadow:
  0 0 8px #39e78c,
  4px 4px 0 #155538;
}

.subtitle{
 color:#7da98f;
 font-size:11px;
 letter-spacing:3px;
 margin-top:8px;
}

.cave{
 font-size:65px;
 margin:30px 0;
 filter:drop-shadow(0 0 15px #36d982);
}

#play{
 width:85%;
 max-width:290px;
 padding:18px;
 background:#176a43;
 color:#ffffff;
 border:2px solid #5af4a1;
 border-radius:5px;
 font-size:17px;
 letter-spacing:2px;
 box-shadow:0 0 20px #176a4366;
}

#play:active{
 background:#269c61;
 transform:scale(.97);
}

.version{
 position:absolute;
 bottom:18px;
 color:#527b65;
 font-size:10px;
 letter-spacing:2px;
}

#full{
 font-size:15px;
}
</style>
</head>

<body>

<header>
 <div class="logo">⚛ PROTON ENGINE</div>
 <button id="full">⛶</button>
</header>

<main>

 <canvas id="game"></canvas>

 <div class="hud" id="hud">
  <span>HP: 100</span>
  <span>BOMB CAVE DEMO</span>
  <span>LEVEL 01</span>
 </div>

 <div class="controls" id="controls">
  <div id="stick">
   <div id="knob"></div>
  </div>

  <div class="look">
   <button class="action" id="left">↶</button>
   <button class="action" id="right">↷</button>
  </div>
 </div>

 <div id="menu">
  <div class="studio">THREE PURPLE APRESENTA</div>

  <div class="title">BOMB CAVE</div>

  <div class="subtitle">
   AN EXPERIMENTAL GAME DEMO
  </div>

  <div class="cave">⛰️</div>

  <button id="play">▶ JOGAR DEMO</button>

  <div class="version">
   PROTON ENGINE • BUILD 0.1
  </div>
 </div>

</main>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const map=[
"############",
"#..........#",
"#..##......#",
"#..........#",
"#......#...#",
"#......#...#",
"#..........#",
"#...##.....#",
"#..........#",
"############"
];

let px=2.5;
let py=2.5;
let angle=0;
let gameStarted=false;

const FOV=Math.PI/3;

let moveX=0;
let moveY=0;

function resize(){
 const rect=canvas.getBoundingClientRect();
 const dpr=Math.min(devicePixelRatio||1,2);

 canvas.width=Math.floor(rect.width*dpr);
 canvas.height=Math.floor(rect.height*dpr);
}

window.addEventListener("resize",resize);
resize();

function wall(x,y){
 const mx=Math.floor(x);
 const my=Math.floor(y);

 return !map[my] || map[my][mx]!==".";
}

function render(){

 const w=canvas.width;
 const h=canvas.height;

 if(!w||!h)return;

 ctx.fillStyle="#182b3b";
 ctx.fillRect(0,0,w,h/2);

 ctx.fillStyle="#403b32";
 ctx.fillRect(0,h/2,w,h/2);

 for(let x=0;x<w;x++){

  const ray=angle-FOV/2+(x/w)*FOV;

  const dx=Math.cos(ray);
  const dy=Math.sin(ray);

  let dist=0.02;
  let hitX=0;
  let hitY=0;

  while(dist<16){

   hitX=px+dx*dist;
   hitY=py+dy*dist;

   if(wall(hitX,hitY))break;

   dist+=0.025;
  }

  const corrected=Math.max(
   0.1,
   dist*Math.cos(ray-angle)
  );

  const wallHeight=Math.min(
   h*3,
   h/corrected
  );

  const top=h/2-wallHeight/2;

  const brightness=Math.max(
   0.15,
   1-corrected/10
  );

  const texture=Math.floor(
   (hitX*9+hitY*9)%2
  );

  const green=texture?190:125;

  ctx.fillStyle=`rgb(
   ${Math.floor(35*brightness)},
   ${Math.floor(green*brightness)},
   ${Math.floor(105*brightness)}
  )`;

  ctx.fillRect(x,top,1,wallHeight);
 }
}

function update(){

 if(gameStarted){

  const speed=0.045;

  const nx=
   px+Math.cos(angle)*moveY*speed+
   Math.cos(angle+Math.PI/2)*moveX*speed;

  const ny=
   py+Math.sin(angle)*moveY*speed+
   Math.sin(angle+Math.PI/2)*moveX*speed;

  if(!wall(nx,py))px=nx;
  if(!wall(px,ny))py=ny;
 }

 render();
 requestAnimationFrame(update);
}

requestAnimationFrame(update);

// INICIAR DEMO

document.getElementById("play").onclick=()=>{
 gameStarted=true;

 document.getElementById("menu").style.display="none";
 document.getElementById("hud").style.display="flex";
 document.getElementById("controls").style.display="flex";
};

// JOYSTICK

const stick=document.getElementById("stick");
const knob=document.getElementById("knob");

let active=false;

function joystick(e){

 const r=stick.getBoundingClientRect();

 let dx=e.clientX-(r.left+r.width/2);
 let dy=e.clientY-(r.top+r.height/2);

 const max=34;
 const len=Math.hypot(dx,dy);

 if(len>max){
  dx=dx/len*max;
  dy=dy/len*max;
 }

 knob.style.transform=`translate(${dx}px,${dy}px)`;

 moveX=dx/max;
 moveY=-dy/max;
}

stick.addEventListener("pointerdown",e=>{
 active=true;
 stick.setPointerCapture(e.pointerId);
 joystick(e);
});

stick.addEventListener("pointermove",e=>{
 if(active)joystick(e);
});

function release(){
 active=false;
 moveX=0;
 moveY=0;
 knob.style.transform="translate(0,0)";
}

stick.addEventListener("pointerup",release);
stick.addEventListener("pointercancel",release);

// ROTAÇÃO

document.getElementById("left").onpointerdown=()=>{
 angle-=0.18;
};

document.getElementById("right").onpointerdown=()=>{
 angle+=0.18;
};

// TELA CHEIA

document.getElementById("full").onclick=async()=>{
 try{
  if(!document.fullscreenElement){
   await document.documentElement.requestFullscreen();
  }else{
   await document.exitFullscreen();
  }
 }catch(e){
  console.log("Fullscreen indisponível",e);
 }
};

</script>

<script>
if("serviceWorker" in navigator){
 window.addEventListener("load",()=>{
  navigator.serviceWorker.register("./sw.js");
 });
}
</script>

</body>
</html>
